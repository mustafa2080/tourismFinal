<!DOCTYPE html>
<html lang="en" id="html-root">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover Amazing Travel Packages & Tours | Book Your Dream Vacation Today" />
    <meta name="keywords" content="tours, travel packages, vacation booking, travel deals, adventure tours, travel agency" />
    <meta name="author" content="Travluyo" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    
    <!-- Canonical URL (will be updated dynamically by React) -->
    <link rel="canonical" href="https://travluyo.com/" id="canonical-link" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://travluyo.com/" />
    <meta property="og:title" content="Travluyo | Book Your Next Adventure" />
    <meta property="og:description" content="Discover Amazing Travel Packages & Tours | Book Your Dream Vacation Today" />
    <meta property="og:image" content="https://travluyo.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Travluyo" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://travluyo.com/" />
    <meta name="twitter:title" content="Travluyo | Book Your Next Adventure" />
    <meta name="twitter:description" content="Discover Amazing Travel Packages & Tours | Book Your Dream Vacation Today" />
    <meta name="twitter:image" content="https://travluyo.com/og-image.jpg" />
    
    <!-- SEO Meta Tags -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0066cc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />

    <!-- Brand Font: Outfit (headings/logo) + Inter (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Lottie player: loaded early (in head) so the custom element is ready before body paints -->
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
    
    <!-- Title -->
    <title>Travluyo | Book Your Next Adventure</title>
    
    <!-- Structured Data Schema (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Travluyo",
      "url": "https://travluyo.com",
      "logo": "https://travluyo.com/logo-512.webp",
      "sameAs": [
        "https://www.facebook.com/yourpage",
        "https://www.twitter.com/yourprofile",
        "https://www.instagram.com/yourprofile"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "support@travluyo.com"
      }
    }
    </script>
    
    <!-- Additional structured data for Travel Agency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "TravelAgency",
      "name": "Travluyo",
      "url": "https://travluyo.com",
      "email": "support@travluyo.com",
      "priceRange": "$$$",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "2000"
      }
    }
    </script>
    <!-- Initial Loader Styles (inline so it paints before any CSS/JS bundle loads) -->
    <style>
      html.light #initial-loader { background: #ffffff; }
      html.dark #initial-loader { background: #0a0f1e; }

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Soft ambient glow behind the mark, matching brand gradient */
      #initial-loader::before {
        content: '';
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.16), rgba(59, 130, 246, 0.06) 55%, transparent 75%);
        filter: blur(10px);
        animation: loader-glow 3.2s ease-in-out infinite;
      }

      .loader-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .loader-mark {
        position: relative;
        width: 200px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      dotlottie-player {
        display: block;
        width: 100%;
        height: 100%;
      }

      .loader-tagline {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #94a3b8;
        opacity: 0;
        animation: loader-fade-in 0.6s ease forwards 0.9s;
      }

      html.dark .loader-tagline { color: #64748b; }

      @keyframes loader-glow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }

      @keyframes loader-fade-in {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader::before {
          animation: none;
        }
        dotlottie-player {
          display: none;
        }
        .loader-tagline {
          opacity: 1;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Initial Loader: shown instantly, removed once React has mounted -->
    <div id="initial-loader">
      <div class="loader-inner">
        <div class="loader-mark">
          <dotlottie-player
            src="/loading.lottie"
            autoplay
            loop
            style="width: 100%; height: 100%;"
          ></dotlottie-player>
        </div>
        <span class="loader-tagline">Book Your Next Adventure</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Schema markup for breadcrumbs will be injected by React -->
    <script id="breadcrumb-schema" type="application/ld+json" style="display:none;"></script>
  </body>
</html>
