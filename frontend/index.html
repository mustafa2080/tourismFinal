<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover Amazing Travel Packages & Tours | Book Your Dream Vacation Today" />
    <meta name="keywords" content="tours, travel packages, vacation booking, travel deals, adventure tours, travel agency" />
    <meta name="author" content="Tour Booking Platform" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/vite.svg" />
    
    <!-- Canonical URL (will be updated dynamically by React) -->
    <link rel="canonical" href="https://yourdomain.com/" id="canonical-link" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:title" content="Travel Packages & Tours Booking Platform" />
    <meta property="og:description" content="Discover Amazing Travel Packages & Tours | Book Your Dream Vacation Today" />
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />
    <meta property="og:site_name" content="Tour Booking Platform" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://yourdomain.com/" />
    <meta name="twitter:title" content="Travel Packages & Tours Booking Platform" />
    <meta name="twitter:description" content="Discover Amazing Travel Packages & Tours | Book Your Dream Vacation Today" />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.jpg" />
    
    <!-- SEO Meta Tags -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0066cc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    
    <!-- Title -->
    <title>Travel Packages & Tours Booking Platform | Book Your Next Adventure</title>
    
    <!-- Structured Data Schema (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Tour Booking Platform",
      "url": "https://yourdomain.com",
      "logo": "https://yourdomain.com/logo.png",
      "sameAs": [
        "https://www.facebook.com/yourpage",
        "https://www.twitter.com/yourprofile",
        "https://www.instagram.com/yourprofile"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "telephone": "+1-XXXXXXXXXX",
        "email": "support@yourdomain.com"
      }
    }
    </script>
    
    <!-- Additional structured data for Travel Agency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "TravelAgency",
      "name": "Tour Booking Platform",
      "url": "https://yourdomain.com",
      "telephone": "+1-XXXXXXXXXX",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Your Street Address",
        "addressLocality": "Your City",
        "postalCode": "XXXXX",
        "addressCountry": "US"
      },
      "priceRange": "$$$",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "2000"
      }
    }
    </script>
    <!-- Initial Loader Styles (inline so it paints before any CSS/JS bundle loads) -->
    <style>
      html.light #initial-loader { background: #ffffff; }
      html.dark #initial-loader { background: #0f172a; }

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .loader-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #3b82f6 0%, #a855f7 50%, #ec4899 100%);
        box-shadow: 0 8px 24px rgba(139, 92, 246, 0.35);
        animation: loader-pulse 1.8s ease-in-out infinite;
      }

      .loader-logo svg {
        width: 32px;
        height: 32px;
        stroke: #fff;
      }

      .loader-ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #8b5cf6;
        animation: loader-spin 0.8s linear infinite;
      }

      html.dark .loader-ring {
        border-color: rgba(148, 163, 184, 0.15);
        border-top-color: #a855f7;
      }

      .loader-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        background: linear-gradient(135deg, #3b82f6, #a855f7, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      @keyframes loader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-logo, .loader-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Initial Loader: shown instantly, removed once React has mounted -->
    <div id="initial-loader">
      <div class="loader-inner">
        <div class="loader-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <div class="loader-ring"></div>
        <span class="loader-text">Voyager Tours</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Schema markup for breadcrumbs will be injected by React -->
    <script id="breadcrumb-schema" type="application/ld+json" style="display:none;"></script>
  </body>
</html>
